<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Markdown 编辑器</title>
		<script src="marked.min.js"></script>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			body {
				font-family:
					-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial,
					sans-serif;
				background: #f5f5f5;
				color: #111827;
				min-height: 100vh;
				padding: 40px 20px;
			}

			.container {
				max-width: 1200px;
				margin: 0 auto;
			}

			/* ===== 顶部标题区 ===== */
			.header {
				display: flex;
				align-items: flex-start;
				justify-content: space-between;
				margin-bottom: 24px;
			}

			.header-left h1 {
				font-size: 28px;
				font-weight: 700;
				color: #111827;
				margin-bottom: 6px;
			}

			.header-left p {
				font-size: 14px;
				color: #6b7280;
			}

			/* ===== 工具栏 ===== */
			.toolbar {
				display: flex;
				align-items: center;
				gap: 8px;
			}

			.toolbar-btn {
				height: 40px;
				padding: 0 16px;
				border: 1px solid #e5e7eb;
				border-radius: 8px;
				background: #fff;
				color: #374151;
				font-size: 14px;
				font-weight: 500;
				cursor: pointer;
				display: inline-flex;
				align-items: center;
				gap: 6px;
				transition: all 0.15s;
				white-space: nowrap;
			}

			.toolbar-btn:hover {
				background: #f9fafb;
				border-color: #d1d5db;
			}

			.toolbar-btn.active {
				background: #111827;
				color: #fff;
				border-color: #111827;
			}

			.toolbar-btn.active:hover {
				background: #1f2937;
			}

			.toolbar-btn.primary {
				background: #111827;
				color: #fff;
				border-color: #111827;
			}

			.toolbar-btn.primary:hover {
				background: #1f2937;
			}

			.toolbar-btn.primary:disabled {
				background: #9ca3af;
				border-color: #9ca3af;
				cursor: not-allowed;
			}

			.toolbar-btn svg {
				width: 16px;
				height: 16px;
				flex-shrink: 0;
			}

			#fileInput {
				display: none;
			}

			/* ===== 内容区 ===== */
			.content-card {
				background: #fff;
				border: 1px solid #e5e7eb;
				border-radius: 12px;
				overflow: hidden;
				display: flex;
				height: 80vh;
			}

			/* 编辑面板 */
			.editor-panel {
				flex: 1;
				display: flex;
				flex-direction: column;
				min-width: 0;
				border-right: 1px solid #e5e7eb;
			}

			.editor-panel.hidden {
				display: none;
			}

			.panel-header {
				height: 44px;
				padding: 0 20px;
				display: flex;
				align-items: center;
				gap: 8px;
				border-bottom: 1px solid #e5e7eb;
				font-size: 13px;
				font-weight: 500;
				color: #6b7280;
				flex-shrink: 0;
				background: #fafafa;
			}

			.panel-header svg {
				width: 14px;
				height: 14px;
				color: #9ca3af;
			}

			#mdEditor {
				flex: 1;
				width: 100%;
				border: none;
				outline: none;
				resize: none;
				padding: 24px;
				font-family:
					"SFMono-Regular", Consolas, "Liberation Mono", Menlo, "Courier New",
					monospace;
				font-size: 14px;
				line-height: 1.8;
				color: #111827;
				background: #fff;
				tab-size: 2;
			}

			#mdEditor::placeholder {
				color: #d1d5db;
			}

			/* 预览面板 */
			.preview-panel {
				flex: 1;
				display: flex;
				flex-direction: column;
				min-width: 0;
			}

			.preview-content {
				flex: 1;
				overflow-y: auto;
				padding: 24px;
				font-size: 15px;
				line-height: 1.8;
				color: #111827;
				position: relative;
			}

			/* ===== 预览区 Markdown 渲染样式 ===== */
			.preview-content h1,
			.preview-content h2,
			.preview-content h3,
			.preview-content h4,
			.preview-content h5,
			.preview-content h6 {
				color: #111827;
				margin-top: 24px;
				margin-bottom: 12px;
				font-weight: 700;
			}
			.preview-content h1 {
				font-size: 2em;
				border-bottom: 1px solid #e5e7eb;
				padding-bottom: 8px;
			}
			.preview-content h2 {
				font-size: 1.5em;
				border-bottom: 1px solid #e5e7eb;
				padding-bottom: 6px;
			}
			.preview-content h3 {
				font-size: 1.25em;
			}
			.preview-content p {
				margin-bottom: 16px;
			}
			.preview-content a {
				color: #2563eb;
				text-decoration: none;
			}
			.preview-content strong {
				font-weight: 700;
			}
			.preview-content code {
				background: #f3f4f6;
				padding: 2px 6px;
				border-radius: 4px;
				font-size: 0.9em;
				font-family: "SFMono-Regular", Consolas, monospace;
				color: #e11d48;
			}
			.preview-content pre {
				background: #1f2937;
				color: #e5e7eb;
				padding: 16px 20px;
				border-radius: 8px;
				overflow-x: auto;
				margin-bottom: 16px;
				line-height: 1.6;
			}
			.preview-content pre code {
				background: none;
				padding: 0;
				color: inherit;
				font-size: 13px;
			}
			.preview-content blockquote {
				border-left: 4px solid #e5e7eb;
				padding: 12px 20px;
				margin: 16px 0;
				color: #6b7280;
				background: #f9fafb;
				border-radius: 0 8px 8px 0;
			}
			.preview-content ul,
			.preview-content ol {
				padding-left: 2em;
				margin-bottom: 16px;
			}
			.preview-content li {
				margin: 6px 0;
			}
			.preview-content table {
				border-collapse: collapse;
				width: 100%;
				margin: 16px 0;
			}
			.preview-content th,
			.preview-content td {
				border: 1px solid #e5e7eb;
				padding: 10px 14px;
				text-align: left;
			}
			.preview-content th {
				background: #f9fafb;
				font-weight: 600;
			}
			.preview-content hr {
				border: none;
				border-top: 1px solid #e5e7eb;
				margin: 24px 0;
			}
			.preview-content img {
				max-width: 100%;
				border-radius: 8px;
			}

			/* 空状态 */
			.preview-empty {
				color: #d1d5db;
				font-size: 14px;
			}

			/* ===== 状态提示 ===== */
			.status-toast {
				position: fixed;
				top: 24px;
				left: 50%;
				transform: translateX(-50%) translateY(-40px);
				background: #111827;
				color: #fff;
				padding: 14px 28px;
				border-radius: 10px;
				font-size: 15px;
				font-weight: 500;
				opacity: 0;
				transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
				pointer-events: none;
				z-index: 100;
				box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
			}

			.status-toast.show {
				opacity: 1;
				transform: translateX(-50%) translateY(0);
			}

			.status-toast.error {
				background: #ef4444;
			}
			.status-toast.success {
				background: #10b981;
			}

			/* ===== 强制更新遮罩 ===== */
			.update-overlay {
				display: none;
				position: fixed;
				inset: 0;
				background: rgba(0, 0, 0, 0.7);
				z-index: 1000;
				align-items: center;
				justify-content: center;
			}
			.update-overlay.show {
				display: flex;
			}
			.update-card {
				background: #fff;
				border-radius: 16px;
				padding: 40px 48px;
				max-width: 480px;
				text-align: center;
				box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
			}
			.update-card h2 {
				font-size: 22px;
				color: #111827;
				margin-bottom: 12px;
			}
			.update-card p {
				font-size: 15px;
				color: #6b7280;
				margin-bottom: 8px;
				line-height: 1.6;
			}
			.update-card .version-info {
				display: flex;
				justify-content: center;
				gap: 24px;
				margin: 20px 0;
				font-size: 14px;
			}
			.update-card .ver-item {
				padding: 8px 16px;
				border-radius: 8px;
				background: #f3f4f6;
			}
			.update-card .ver-item.current {
				background: #fef2f2;
				color: #dc2626;
			}
			.update-card .ver-item.latest {
				background: #f0fdf4;
				color: #16a34a;
			}
			.update-card .ver-label {
				font-size: 12px;
				color: #9ca3af;
				display: block;
				margin-bottom: 2px;
			}
			.update-card .download-btn {
				display: inline-block;
				margin-top: 16px;
				padding: 12px 32px;
				background: linear-gradient(135deg, #1e40af, #7c3aed);
				color: #fff;
				border: none;
				border-radius: 8px;
				font-size: 15px;
				font-weight: 600;
				cursor: pointer;
				text-decoration: none;
				transition: opacity 0.15s;
			}
			.update-card .download-btn:hover {
				opacity: 0.9;
			}

			/* ===== 水印配置面板 ===== */
			.watermark-wrapper {
				position: relative;
			}

			.watermark-panel {
				display: none;
				position: absolute;
				top: calc(100% + 8px);
				right: 0;
				width: 300px;
				background: #fff;
				border: 1px solid #e5e7eb;
				border-radius: 12px;
				box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12);
				z-index: 50;
				padding: 20px;
			}

			.watermark-panel.show {
				display: block;
			}

			.watermark-panel h3 {
				font-size: 15px;
				font-weight: 600;
				color: #111827;
				margin-bottom: 16px;
			}

			.wm-field {
				margin-bottom: 14px;
			}

			.wm-field label {
				display: block;
				font-size: 13px;
				font-weight: 500;
				color: #374151;
				margin-bottom: 6px;
			}

			.wm-field input[type="text"] {
				width: 100%;
				height: 36px;
				border: 1px solid #e5e7eb;
				border-radius: 8px;
				padding: 0 12px;
				font-size: 14px;
				color: #111827;
				outline: none;
				transition: border-color 0.15s;
			}

			.wm-field input[type="text"]:focus {
				border-color: #111827;
			}

			.wm-field input[type="text"]::placeholder {
				color: #d1d5db;
			}

			.wm-slider-row {
				display: flex;
				align-items: center;
				gap: 10px;
			}

			.wm-slider-row input[type="range"] {
				flex: 1;
				height: 4px;
				-webkit-appearance: none;
				appearance: none;
				background: #e5e7eb;
				border-radius: 2px;
				outline: none;
			}

			.wm-slider-row input[type="range"]::-webkit-slider-thumb {
				-webkit-appearance: none;
				width: 16px;
				height: 16px;
				border-radius: 50%;
				background: #111827;
				cursor: pointer;
			}

			.wm-slider-val {
				font-size: 13px;
				color: #6b7280;
				min-width: 36px;
				text-align: right;
				font-variant-numeric: tabular-nums;
			}

			.wm-color-row {
				display: flex;
				align-items: center;
				gap: 10px;
			}

			.wm-color-row input[type="color"] {
				width: 36px;
				height: 36px;
				border: 1px solid #e5e7eb;
				border-radius: 8px;
				padding: 2px;
				cursor: pointer;
				background: #fff;
			}

			.wm-color-auto {
				font-size: 13px;
				color: #6b7280;
				display: flex;
				align-items: center;
				gap: 6px;
				cursor: pointer;
			}

			.wm-color-auto input[type="checkbox"] {
				accent-color: #111827;
			}

			.wm-enable-row {
				display: flex;
				align-items: center;
				justify-content: space-between;
				margin-bottom: 16px;
				padding-bottom: 14px;
				border-bottom: 1px solid #f3f4f6;
			}

			.wm-enable-row label {
				font-size: 14px;
				font-weight: 500;
				color: #111827;
			}

			.wm-toggle {
				position: relative;
				width: 44px;
				height: 24px;
				cursor: pointer;
			}

			.wm-toggle input {
				opacity: 0;
				width: 0;
				height: 0;
			}

			.wm-toggle .slider {
				position: absolute;
				inset: 0;
				background: #d1d5db;
				border-radius: 12px;
				transition: background 0.2s;
			}

			.wm-toggle .slider::before {
				content: "";
				position: absolute;
				width: 18px;
				height: 18px;
				left: 3px;
				top: 3px;
				background: #fff;
				border-radius: 50%;
				transition: transform 0.2s;
			}

			.wm-toggle input:checked + .slider {
				background: #111827;
			}

			.wm-toggle input:checked + .slider::before {
				transform: translateX(20px);
			}

			.toolbar-btn.has-watermark {
				background: #f0fdf4;
				border-color: #86efac;
				color: #16a34a;
			}

			.toolbar-btn.has-watermark:hover {
				background: #dcfce7;
			}
		</style>
	</head>
	<body>
		<div class="container">
			<!-- 顶部 -->
			<div class="header">
				<div class="header-left">
					<h1>编辑器</h1>
					<p>在下方输入 Markdown 内容进行实时预览</p>
				</div>
				<div class="toolbar">
					<button class="toolbar-btn active" id="btnSplit">
						<svg
							viewBox="0 0 24 24"
							fill="none"
							stroke="currentColor"
							stroke-width="2">
							<rect x="3" y="3" width="18" height="18" rx="2" />
							<line x1="12" y1="3" x2="12" y2="21" />
						</svg>
						分屏
					</button>
					<button class="toolbar-btn" id="btnPreview">
						<svg
							viewBox="0 0 24 24"
							fill="none"
							stroke="currentColor"
							stroke-width="2">
							<circle cx="12" cy="12" r="3" />
							<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z" />
						</svg>
						预览
					</button>
					<button class="toolbar-btn" id="btnUpload">
						<svg
							viewBox="0 0 24 24"
							fill="none"
							stroke="currentColor"
							stroke-width="2">
							<path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4" />
							<polyline points="17 8 12 3 7 8" />
							<line x1="12" y1="3" x2="12" y2="15" />
						</svg>
						上传
					</button>
					<div class="watermark-wrapper">
						<button class="toolbar-btn" id="btnWatermark">
							<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
								<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/>
								<path d="M8 12l2 2 4-4"/>
							</svg>
							水印
						</button>
						<div class="watermark-panel" id="watermarkPanel">
							<h3>水印设置</h3>
							<div class="wm-enable-row">
								<label>启用水印</label>
								<label class="wm-toggle">
									<input type="checkbox" id="wmEnabled" />
									<span class="slider"></span>
								</label>
							</div>
							<div class="wm-field">
								<label>水印文字</label>
								<input type="text" id="wmText" placeholder="请输入水印文字" maxlength="50" />
							</div>
							<div class="wm-field">
								<label>透明度</label>
								<div class="wm-slider-row">
									<input type="range" id="wmOpacity" min="0.05" max="0.5" step="0.01" value="0.15" />
									<span class="wm-slider-val" id="wmOpacityVal">0.15</span>
								</div>
							</div>
							<div class="wm-field">
								<label>字号</label>
								<div class="wm-slider-row">
									<input type="range" id="wmFontSize" min="12" max="48" step="1" value="24" />
									<span class="wm-slider-val" id="wmFontSizeVal">24px</span>
								</div>
							</div>
							<div class="wm-field">
								<label>旋转角度</label>
								<div class="wm-slider-row">
									<input type="range" id="wmRotate" min="-90" max="90" step="1" value="-30" />
									<span class="wm-slider-val" id="wmRotateVal">-30°</span>
								</div>
							</div>
							<div class="wm-field">
								<label>颜色</label>
								<div class="wm-color-row">
									<label class="wm-color-auto">
										<input type="checkbox" id="wmColorAuto" checked />
										跟随主题
									</label>
									<input type="color" id="wmColor" value="#000000" />
								</div>
							</div>
						</div>
					</div>
					<button class="toolbar-btn primary" id="btnGenerate">
						<svg
							viewBox="0 0 24 24"
							fill="none"
							stroke="currentColor"
							stroke-width="2">
							<rect x="3" y="3" width="18" height="18" rx="2" />
							<circle cx="8.5" cy="8.5" r="1.5" />
							<polyline points="21 15 16 10 5 21" />
						</svg>
						生成图片
					</button>
				</div>
			</div>

			<!-- 内容区 -->
			<div class="content-card" id="contentCard">
				<div class="editor-panel" id="editorPanel">
					<div class="panel-header">
						<svg
							viewBox="0 0 24 24"
							fill="none"
							stroke="currentColor"
							stroke-width="2">
							<polyline points="16 18 22 12 16 6" />
							<polyline points="8 6 2 12 8 18" />
						</svg>
						Markdown 源码
					</div>
					<textarea
						id="mdEditor"
						placeholder="在此输入 Markdown 内容..."></textarea>
				</div>
				<div class="preview-panel" id="previewPanel">
					<div class="panel-header">
						<svg
							viewBox="0 0 24 24"
							fill="none"
							stroke="currentColor"
							stroke-width="2">
							<circle cx="12" cy="12" r="3" />
							<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z" />
						</svg>
						实时预览
					</div>
					<div class="preview-content" id="previewArea">
						<p class="preview-empty">预览区域 — 输入 Markdown 后实时渲染</p>
					</div>
				</div>
			</div>
		</div>

		<input type="file" id="fileInput" accept=".md,.markdown,.txt" />
		<div class="status-toast" id="toast"></div>
		<div class="update-overlay" id="updateOverlay">
			<div class="update-card">
				<h2>发现新版本</h2>
				<p>当前版本已停止支持，请更新至最新版本后使用</p>
				<div class="version-info">
					<div class="ver-item current">
						<span class="ver-label">当前版本</span>
						v<span id="currentVer"></span>
					</div>
					<div class="ver-item latest">
						<span class="ver-label">最新版本</span>
						v<span id="latestVer"></span>
					</div>
				</div>
				<a class="download-btn" id="updateBtn" href="#" target="_blank">前往下载</a>
			</div>
		</div>

		<script>
			const btnSplit = document.getElementById("btnSplit");
			const btnPreview = document.getElementById("btnPreview");
			const btnUpload = document.getElementById("btnUpload");
			const btnGenerate = document.getElementById("btnGenerate");
			const fileInput = document.getElementById("fileInput");
			const editorPanel = document.getElementById("editorPanel");
			const previewPanel = document.getElementById("previewPanel");
			const mdEditor = document.getElementById("mdEditor");
			const previewArea = document.getElementById("previewArea");
			const toast = document.getElementById("toast");

			let mode = "split";
			let toastTimer = null;
			let uploadedFileName = "";

			// ===== 水印配置 =====
			const btnWatermark = document.getElementById("btnWatermark");
			const watermarkPanel = document.getElementById("watermarkPanel");
			const wmEnabled = document.getElementById("wmEnabled");
			const wmText = document.getElementById("wmText");
			const wmOpacity = document.getElementById("wmOpacity");
			const wmOpacityVal = document.getElementById("wmOpacityVal");
			const wmFontSize = document.getElementById("wmFontSize");
			const wmFontSizeVal = document.getElementById("wmFontSizeVal");
			const wmRotate = document.getElementById("wmRotate");
			const wmRotateVal = document.getElementById("wmRotateVal");
			const wmColorAuto = document.getElementById("wmColorAuto");
			const wmColor = document.getElementById("wmColor");

			// 水印默认配置
			const wmDefaults = {
				enabled: false,
				text: "",
				opacity: 0.15,
				fontSize: 24,
				rotate: -30,
				colorAuto: true,
				color: "#000000",
			};

			// 从 localStorage 加载水印配置
			function loadWatermarkConfig() {
				try {
					const saved = JSON.parse(localStorage.getItem("wmConfig"));
					if (saved) return { ...wmDefaults, ...saved };
				} catch {}
				return { ...wmDefaults };
			}

			// 保存水印配置到 localStorage
			function saveWatermarkConfig() {
				const config = {
					enabled: wmEnabled.checked,
					text: wmText.value,
					opacity: parseFloat(wmOpacity.value),
					fontSize: parseInt(wmFontSize.value),
					rotate: parseInt(wmRotate.value),
					colorAuto: wmColorAuto.checked,
					color: wmColor.value,
				};
				localStorage.setItem("wmConfig", JSON.stringify(config));
				updateWatermarkBtn();
			}

			// 初始化水印面板
			function initWatermarkPanel() {
				const config = loadWatermarkConfig();
				wmEnabled.checked = config.enabled;
				wmText.value = config.text;
				wmOpacity.value = config.opacity;
				wmOpacityVal.textContent = config.opacity;
				wmFontSize.value = config.fontSize;
				wmFontSizeVal.textContent = config.fontSize + "px";
				wmRotate.value = config.rotate;
				wmRotateVal.textContent = config.rotate + "°";
				wmColorAuto.checked = config.colorAuto;
				wmColor.value = config.color;
				wmColor.disabled = config.colorAuto;
				updateWatermarkBtn();
			}

			// 更新水印按钮样式
			function updateWatermarkBtn() {
				btnWatermark.classList.toggle("has-watermark", wmEnabled.checked && wmText.value.trim());
			}

			// 水印面板开关
			btnWatermark.addEventListener("click", (e) => {
				e.stopPropagation();
				watermarkPanel.classList.toggle("show");
			});

			// 点击外部关闭面板
			document.addEventListener("click", (e) => {
				if (!watermarkPanel.contains(e.target) && e.target !== btnWatermark) {
					watermarkPanel.classList.remove("show");
				}
			});

			// 阻止面板内部点击冒泡
			watermarkPanel.addEventListener("click", (e) => e.stopPropagation());

			// 滑块实时显示
			wmOpacity.addEventListener("input", () => {
				wmOpacityVal.textContent = wmOpacity.value;
				saveWatermarkConfig();
				renderPreviewWatermark();
			});
			wmFontSize.addEventListener("input", () => {
				wmFontSizeVal.textContent = wmFontSize.value + "px";
				saveWatermarkConfig();
				renderPreviewWatermark();
			});
			wmRotate.addEventListener("input", () => {
				wmRotateVal.textContent = wmRotate.value + "°";
				saveWatermarkConfig();
				renderPreviewWatermark();
			});

			// 颜色自动/自定义切换
			wmColorAuto.addEventListener("change", () => {
				wmColor.disabled = wmColorAuto.checked;
				saveWatermarkConfig();
				renderPreviewWatermark();
			});
			wmColor.addEventListener("input", () => { saveWatermarkConfig(); renderPreviewWatermark(); });

			// 其他输入变化
			wmEnabled.addEventListener("change", () => { saveWatermarkConfig(); renderPreviewWatermark(); });
			wmText.addEventListener("input", () => { saveWatermarkConfig(); renderPreviewWatermark(); });

			initWatermarkPanel();

			// ===== 模式切换 =====
			function setMode(m) {
				mode = m;
				btnSplit.classList.toggle("active", m === "split");
				btnPreview.classList.toggle("active", m === "preview");
				if (m === "split") {
					editorPanel.classList.remove("hidden");
					editorPanel.style.borderRight = "1px solid #e5e7eb";
				} else {
					editorPanel.classList.add("hidden");
				}
				updatePreview();
			}

			btnSplit.addEventListener("click", () => setMode("split"));
			btnPreview.addEventListener("click", () => setMode("preview"));

			// ===== 实时预览 =====
			let previewTimer = null;

			// 渲染预览区水印覆盖层
			function renderPreviewWatermark() {
				// 移除已有水印
				const old = document.getElementById("previewWmOverlay");
				if (old) old.remove();

				if (!wmEnabled.checked || !wmText.value.trim()) return;

				const text = wmText.value.trim();
				const opacity = Math.max(0.05, Math.min(0.5, parseFloat(wmOpacity.value) || 0.15));
				const fontSize = Math.max(12, Math.min(48, parseInt(wmFontSize.value) || 24));
				const rotate = Math.max(-90, Math.min(90, parseInt(wmRotate.value) || -30));
				const isDark = document.documentElement.getAttribute("data-theme") === "dark";
				const color = wmColorAuto.checked
					? (isDark ? "#FFFFFF" : "#000000")
					: wmColor.value;

				const lineHeight = fontSize * 3;
				const containerWidth = previewArea.clientWidth || 800;
				const repeatCount = Math.ceil((containerWidth * 2.5) / (text.length * fontSize * 0.6));
				const repeatedText = Array(repeatCount).fill(text).join("    ");

				const rows = [];
				for (let i = -10; i < 80; i++) {
					rows.push(`<div style="height:${lineHeight}px;line-height:${lineHeight}px;white-space:nowrap;font-size:${fontSize}px;color:${color};transform:rotate(${rotate}deg);transform-origin:left center">${repeatedText}</div>`);
				}

				const overlay = document.createElement("div");
				overlay.id = "previewWmOverlay";
				overlay.style.cssText = "position:absolute;top:0;left:0;width:100%;height:100%;overflow:hidden;pointer-events:none;z-index:10;opacity:" + opacity;
				overlay.innerHTML = rows.join("");
				previewArea.appendChild(overlay);
			}

			function updatePreview() {
				const md = mdEditor.value;
				if (md.trim()) {
					previewArea.innerHTML = marked.parse(md);
				} else {
					previewArea.innerHTML =
						'<p class="preview-empty">预览区域 — 输入 Markdown 后实时渲染</p>';
				}
				renderPreviewWatermark();
			}

			mdEditor.addEventListener("input", () => {
				clearTimeout(previewTimer);
				previewTimer = setTimeout(updatePreview, 150);
				uploadedFileName = "";
			});

			// ===== 上传 =====
			btnUpload.addEventListener("click", () => fileInput.click());

			fileInput.addEventListener("change", () => {
				const file = fileInput.files[0];
				if (!file) return;
				if (!file.name.match(/\.(md|markdown|txt)$/i)) {
					showToast("仅支持 .md / .markdown / .txt 文件", "error");
					fileInput.value = "";
					return;
				}
				const reader = new FileReader();
				reader.onload = (e) => {
					mdEditor.value = e.target.result;
					updatePreview();
					uploadedFileName = file.name.replace(/\.(md|markdown|txt)$/i, "");
					showToast("已加载: " + file.name, "success");
				};
				reader.onerror = () => showToast("文件读取失败", "error");
				reader.readAsText(file);
				fileInput.value = "";
			});

			// ===== 生成图片 =====
			btnGenerate.addEventListener("click", async () => {
				const text = mdEditor.value.trim();
				if (!text) {
					showToast("请先输入 Markdown 内容", "error");
					return;
				}

				// 确定文件名
				let name = uploadedFileName;
				if (!name) {
					name = prompt("请输入文件名称：");
					if (!name || !name.trim()) {
						return;
					}
					name = name.trim();
				}

				showToast("正在生成图片...");
				btnGenerate.disabled = true;

				try {
					const formData = new FormData();
					formData.append("text", text);
					formData.append("theme", "light");
					formData.append("width", "800");
					formData.append("name", name);

					// 水印参数
					if (wmEnabled.checked && wmText.value.trim()) {
						formData.append("watermarkText", wmText.value.trim());
						formData.append("watermarkOpacity", wmOpacity.value);
						formData.append("watermarkFontSize", wmFontSize.value);
						formData.append("watermarkRotate", wmRotate.value);
						if (!wmColorAuto.checked) {
							formData.append("watermarkColor", wmColor.value);
						}
					}

					const res = await fetch("/convert", {
						method: "POST",
						body: formData,
					});
					const data = await res.json();
					if (res.status === 426) {
						document.getElementById("currentVer").textContent = data.current;
						document.getElementById("latestVer").textContent = data.latest;
						document.getElementById("updateBtn").href = data.url;
						document.getElementById("updateOverlay").classList.add("show");
						return;
					}
					if (!res.ok) {
						throw new Error(data.error || "转换失败");
					}

					// 显示保存结果
					const displayName = data.displayName || data.filename;
					showToast("已保存至 output/" + displayName, "success");
				} catch (err) {
					showToast(err.message, "error");
				} finally {
					btnGenerate.disabled = false;
				}
			});

			// ===== Toast 提示 =====
			function showToast(msg, type) {
				clearTimeout(toastTimer);
				toast.textContent = msg;
				toast.className = "status-toast show" + (type ? " " + type : "");
				toastTimer = setTimeout(() => {
					toast.classList.remove("show");
				}, 3000);
			}

			// ===== Tab 键支持 =====
			mdEditor.addEventListener("keydown", (e) => {
				if (e.key === "Tab") {
					e.preventDefault();
					const start = mdEditor.selectionStart;
					const end = mdEditor.selectionEnd;
					mdEditor.value =
						mdEditor.value.substring(0, start) +
						"  " +
						mdEditor.value.substring(end);
					mdEditor.selectionStart = mdEditor.selectionEnd = start + 2;
					updatePreview();
				}
			});

			// ===== 拖拽文件 =====
			editorPanel.addEventListener("dragover", (e) => e.preventDefault());
			editorPanel.addEventListener("drop", (e) => {
				e.preventDefault();
				const file = e.dataTransfer.files[0];
				if (!file) return;
				if (!file.name.match(/\.(md|markdown|txt)$/i)) {
					showToast("仅支持 .md / .markdown / .txt 文件", "error");
					return;
				}
				const reader = new FileReader();
				reader.onload = (ev) => {
					mdEditor.value = ev.target.result;
					updatePreview();
					uploadedFileName = file.name.replace(/\.(md|markdown|txt)$/i, "");
					showToast("已加载: " + file.name, "success");
				};
				reader.readAsText(file);
			});

			// ===== 版本检测（强制更新） =====
			(async () => {
				try {
					const res = await fetch("/api/version");
					const data = await res.json();
					if (data.hasUpdate) {
						document.getElementById("currentVer").textContent = data.current;
						document.getElementById("latestVer").textContent = data.latest;
						document.getElementById("updateBtn").href = data.url;
						document.getElementById("updateOverlay").classList.add("show");
					}
				} catch {
					// 网络不可达时允许正常使用
				}
			})();
		</script>
	</body>
</html>
